name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:isolation
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm manifest:check
      - run: pnpm smoke:packages
      - run: pnpm smoke:consumer
      - run: pnpm test:harness
      - run: pnpm test
