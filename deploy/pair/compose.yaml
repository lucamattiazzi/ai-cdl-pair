services:
  pair:
    build:
      context: ../..
      dockerfile: deploy/pair/Dockerfile
      args:
        PAIR_PUBLIC_ORIGIN: https://${PAIR_DOMAIN}
    restart: unless-stopped
    environment:
      PAIR_PUBLIC_ORIGIN: https://${PAIR_DOMAIN}
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - pair
    environment:
      PAIR_DOMAIN: ${PAIR_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
